<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>Tomo</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262a33; --text:#e7e9ee; --dim:#8a90a0; --me:#2f6fed; --tool:#1d2a1f; }
  * { box-sizing: border-box; }
  body { margin:0; height:100dvh; display:flex; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; }
  aside { width:260px; border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; }
  aside h1 { font-size:16px; margin:16px; }
  aside nav { overflow:auto; flex:1; }
  aside button { display:block; width:100%; text-align:left; padding:10px 16px; background:none; border:0; color:var(--dim); cursor:pointer; font:inherit; }
  aside button.on, aside button:hover { color:var(--text); background:#1f232c; }
  aside .sec { padding:12px 16px 4px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(720px, 85%); padding:10px 14px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .assistant { align-self:flex-start; background:var(--panel); border-bottom-left-radius:4px; }
  .tool { align-self:flex-start; background:var(--tool); color:#9fd3a8; font:12px/1.4 ui-monospace, monospace; border-radius:8px; }
  .live { opacity:.85; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); padding-bottom:max(12px, env(safe-area-inset-bottom)); }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; height:44px; max-height:200px; }
  form button { background:var(--me); color:white; border:0; border-radius:12px; padding:0 18px; font:inherit; cursor:pointer; }
  #status { font-size:12px; color:var(--dim); padding:0 20px 6px; min-height:18px; }
  @media (max-width: 720px) { aside { display:none; } }
</style>
</head>
<body>
<aside>
  <h1>Tomo</h1>
  <nav>
    <div class="sec">Conversations</div><div id="convs"></div>
    <div class="sec">Projects</div><div id="projects"></div>
  </nav>
</aside>
<main>
  <div id="log"></div>
  <div id="status"></div>
  <form id="f"><textarea id="t" placeholder="Message Tomo…  (/help for commands)"></textarea><button>Send</button></form>
</main>
<script>
const token = localStorage.token ?? (localStorage.token = prompt("API token (TOMO_API_TOKEN)") ?? "");
const H = { authorization: `Bearer ${token}`, "content-type": "application/json" };
const $ = (id) => document.getElementById(id);
let current = "home", ws, live = null;

const textOf = (msgs) => (msgs ?? []).flatMap((m) => typeof m.content === "string" ? [m.content] : (m.content ?? []).filter((c) => c.type === "text").map((c) => c.text)).join("");

function bubble(cls, text) {
  const d = document.createElement("div");
  d.className = `msg ${cls}`; d.textContent = text;
  $("log").append(d); $("log").scrollTop = 1e9; return d;
}
function renderEntry(e) {
  if (e.kind === "pi.user") bubble("user", textOf(e.model));
  else if (e.kind === "pi.assistant") {
    const t = textOf(e.model); if (t) bubble("assistant", t);
    for (const m of e.model ?? []) for (const c of m.content ?? []) if (c.type === "toolCall") bubble("tool", `→ ${c.name} ${JSON.stringify(c.arguments).slice(0, 160)}`);
  }
}

function connect(id) {
  ws?.close(); $("log").innerHTML = ""; live = null; current = id;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?conversation=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`);
  ws.onmessage = (ev) => {
    for (const e of JSON.parse(ev.data)) {
      if (e.type === "snapshot") { $("log").innerHTML = ""; e.entries.forEach(renderEntry); }
      else if (e.type === "message_start" && e.message.role === "assistant") live = bubble("assistant live", "");
      else if (e.type === "message_update" && live) for (const c of e.changes) if (c.type === "text_delta") { live.textContent += c.delta; $("log").scrollTop = 1e9; }
      else if (e.type === "message_end") { live?.remove(); live = null; renderEntry(e.entry); }
      else if (e.type === "tool_execution_start") $("status").textContent = `running ${e.toolName}…`;
      else if (e.type === "run_start") $("status").textContent = "thinking…";
      else if (e.type === "run_end") $("status").textContent = "";
    }
  };
  ws.onclose = () => setTimeout(() => current === id && connect(id), 2000);
  document.querySelectorAll("#convs button").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
}

async function sidebar() {
  const convs = await (await fetch("/api/conversations", { headers: H })).json();
  $("convs").innerHTML = "";
  for (const c of convs) {
    const b = document.createElement("button");
    b.dataset.id = c.key === "home" ? "home" : c.id; b.textContent = c.key === "home" ? "🏠 Home (all apps)" : c.key;
    b.onclick = () => connect(b.dataset.id); $("convs").append(b);
  }
  const ps = await (await fetch("/api/projects", { headers: H })).json();
  $("projects").innerHTML = ps.map((p) => `<button disabled>${p.status === "active" ? "📁" : "🗄"} ${p.name}</button>`).join("");
}

$("f").onsubmit = (ev) => {
  ev.preventDefault();
  const text = $("t").value.trim(); if (!text) return;
  ws.send(JSON.stringify({ type: "input", text })); $("t").value = "";
};
$("t").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("f").requestSubmit(); } };

sidebar().then(() => connect("home"));
</script>
</body>
</html>
