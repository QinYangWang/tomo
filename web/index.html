<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#fcf9f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/app.css" />
<title>Tomo</title>
</head>
<body>

<!-- first run / sign in -->
<div id="gate" hidden>
  <form id="gateForm">
    <div class="mark">T</div>
    <h1 id="gateTitle" class="serif">Tomo</h1>
    <p id="gateSub" class="muted"></p>
    <input type="password" id="pw" placeholder="密码" />
    <input type="password" id="pw2" placeholder="再输一次" hidden />
    <p class="err" id="gateErr"></p>
    <button class="primary" id="gateBtn">登录</button>
  </form>
</div>

<!-- floating top bar: context button · dock · settings, three separate pieces -->
<header id="bar">
  <button class="float round" id="ctxBtn" data-tip=""></button>
  <nav class="float dock" id="dock">
    <button data-view="home" data-tip="Home"></button>
    <button data-view="chat" data-tip="对话"></button>
    <button data-view="projects" data-tip="项目"></button>
  </nav>
  <button class="float round" id="setBtn" data-tip="设置"></button>
</header>

<!-- project drawer (projects view) -->
<aside id="drawer" class="float" hidden>
  <div class="drawerHead"><span class="serif">项目</span><button class="icon" id="drawerClose" data-tip="收起"></button></div>
  <div id="drawerList"></div>
</aside>

<main>
  <section class="view" id="v-home">
    <div class="page">
      <p class="eyebrow" id="today"></p>
      <h1 class="hello serif" id="hello">你好</h1>
      <div class="panels" id="panels"></div>
    </div>
  </section>

  <section class="view" id="v-chat">
    <div class="convbar"><button class="pill" id="convPick"><span id="convName">Home</span><span class="chev"></span></button></div>
    <div id="thread"><div class="threadInner" id="log"></div></div>
    <form id="composer">
      <textarea id="t" rows="1" placeholder="给 Tomo 发消息"></textarea>
      <button class="send" id="sendBtn" aria-label="发送"></button>
    </form>
  </section>

  <section class="view" id="v-projects">
    <div class="page narrow" id="projectPage"></div>
  </section>
</main>

<div id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden>
  <div class="sheetHead"><button class="icon" id="sheetBack" style="visibility:hidden" data-tip="返回"></button><h2 id="sheetTitle"></h2><button class="icon" id="sheetClose" data-tip="关闭"></button></div>
  <div class="sheetBody" id="sheetBody"></div>
</aside>

<div id="toast" hidden></div>

<script src="/icons.js"></script>
<script src="/app.js"></script>
</body>
</html>
